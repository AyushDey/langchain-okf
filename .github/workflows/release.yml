name: Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_historical_010:
        description: 'Build and publish historical v0.1.0 release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    concurrency: release
    # Do not trigger on release commits produced by the release automation
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semver.outputs.released }}
      version: ${{ steps.semver.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Semantic Release
        id: semver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.publish_historical_010 }}" = "true" ]; then
            echo "Manual historical release of v0.1.0 requested."
            git checkout v0.1.0
            python3 -c '
          with open("pyproject.toml") as f:
              c = f.read()
          c = c.replace("version = \"0.2.0\"", "version = \"0.1.0\"", 1)
          with open("pyproject.toml", "w") as f:
              f.write(c)
          '
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            uvx --from "python-semantic-release>=9.0.0" semantic-release version
            NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

            if [ -n "$NEW_TAG" ] && [ "$NEW_TAG" != "$PREV_TAG" ]; then
              echo "New release detected: $NEW_TAG"
              uvx --from "python-semantic-release>=9.0.0" semantic-release publish
              echo "released=true" >> "$GITHUB_OUTPUT"
              echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
            else
              echo "No new release produced."
              echo "released=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build distribution packages
        if: steps.semver.outputs.released == 'true'
        run: uv build

      - name: Upload package distributions
        if: steps.semver.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-okf
    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
