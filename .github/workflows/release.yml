name: Release & Publish

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    concurrency: release
    # Only run if manual dispatch OR if CI workflow on main passed successfully
    # and the triggering commit is not an automated release commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):'))
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semver.outputs.released }}
      version: ${{ steps.semver.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --dev --extra chroma

      - name: Run Quality Gate & Unit Tests
        run: |
          uv run ruff check langchain_okf/ tests/
          uv run ruff format --check langchain_okf/ tests/
          uv run mypy langchain_okf/
          uv run pytest tests/ -v

      - name: Configure Git Identity & Tracking Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TARGET_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git fetch --tags --force origin

      - name: Run Semantic Release
        id: semver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          uvx --from "python-semantic-release>=9.0.0" semantic-release version
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$NEW_TAG" ] && [ "$NEW_TAG" != "$PREV_TAG" ]; then
            echo "New release detected: $NEW_TAG"

            # Extract release notes directly from CHANGELOG.md as source of truth
            python3 -c '
          import re, sys
          from pathlib import Path

          tag = sys.argv[1].lstrip("v")
          content = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^##\s+v?{re.escape(tag)}\b[^\n]*\n(.*?)(?=^##\s|\Z)"
          match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
          if not match or not match.group(1).strip():
              print(f"❌ Error: Release notes for {tag} not found or empty in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)
          release_notes = match.group(0).strip() + "\n"
          Path("RELEASE_NOTES.md").write_text(release_notes, encoding="utf-8")
          print(f"Extracted {len(release_notes)} bytes of release notes for {tag}")
          ' "$NEW_TAG"

            # Populate GitHub Release description from CHANGELOG.md notes
            gh release edit "$NEW_TAG" --notes-file RELEASE_NOTES.md || \
            gh release create "$NEW_TAG" --title "$NEW_TAG" --notes-file RELEASE_NOTES.md

            # Publish distribution packages to the GitHub release
            uvx --from "python-semantic-release>=9.0.0" semantic-release publish
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "No new release produced."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distribution packages
        if: steps.semver.outputs.released == 'true'
        run: uv build

      - name: Upload package distributions
        if: steps.semver.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-okf
    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
